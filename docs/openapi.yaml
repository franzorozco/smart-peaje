components:
  schemas:
    Alerta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tipo:
          type: string
          readOnly: true
        atendida:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        paso:
          allOf:
          - $ref: '#/components/schemas/Paso'
          readOnly: true
      required:
      - created_at
      - id
      - paso
      - tipo
    Caseta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 80
        ubicacion:
          type: string
          maxLength: 150
      required:
      - id
      - nombre
      - ubicacion
    CategoriaEnum:
      enum:
      - moto
      - auto
      - minibus
      - camion
      - bus
      type: string
      description: |-
        * `moto` - Moto
        * `auto` - Auto
        * `minibus` - Minibús
        * `camion` - Camión
        * `bus` - Bus
    EstadoEnum:
      enum:
      - pagado
      - sin_saldo
      - no_registrado
      - inactivo
      - revision
      type: string
      description: |-
        * `pagado` - Pagado
        * `sin_saldo` - Sin saldo
        * `no_registrado` - No registrado
        * `inactivo` - Inactivo
        * `revision` - Revisión
    PaginatedAlertaList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Alerta'
    PaginatedPasoList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Paso'
    Paso:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        captura_id:
          type: string
          format: uuid
        placa_leida:
          type: string
          maxLength: 20
        placa_normalizada:
          type: string
          maxLength: 12
        confianza_ocr:
          type: number
          format: double
          nullable: true
        categoria_detectada:
          type: string
          maxLength: 15
        ejes_detectados:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        pasajeros:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        monto:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        caseta:
          type: integer
        caseta_nombre:
          type: string
          readOnly: true
        usuario_email:
          type: string
          format: email
          readOnly: true
        imagen:
          type: string
          nullable: true
          readOnly: true
        estado:
          $ref: '#/components/schemas/EstadoEnum'
        latencia_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - captura_id
      - caseta
      - caseta_nombre
      - categoria_detectada
      - created_at
      - ejes_detectados
      - estado
      - id
      - imagen
      - monto
      - placa_leida
      - placa_normalizada
      - usuario_email
    PatchedAlerta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tipo:
          type: string
          readOnly: true
        atendida:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        paso:
          allOf:
          - $ref: '#/components/schemas/Paso'
          readOnly: true
    PatchedCaseta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 80
        ubicacion:
          type: string
          maxLength: 150
    PatchedTarifa:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        categoria:
          $ref: '#/components/schemas/CategoriaEnum'
        ejes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        monto:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
    PatchedUsuario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        nombre:
          type: string
          maxLength: 150
        rol:
          $ref: '#/components/schemas/RolEnum'
        activo:
          type: boolean
          default: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Último inicio de sesión
    PatchedVehiculo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        placa:
          type: string
          maxLength: 12
        propietario:
          type: string
          maxLength: 100
        categoria:
          $ref: '#/components/schemas/CategoriaEnum'
        ejes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        saldo:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        activo:
          type: boolean
    RolEnum:
      enum:
      - administrador
      - operador
      type: string
      description: |-
        * `administrador` - Administrador
        * `operador` - Operador
    Tarifa:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        categoria:
          $ref: '#/components/schemas/CategoriaEnum'
        ejes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        monto:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - categoria
      - ejes
      - id
      - monto
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Usuario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        nombre:
          type: string
          maxLength: 150
        rol:
          $ref: '#/components/schemas/RolEnum'
        activo:
          type: boolean
          default: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Último inicio de sesión
      required:
      - email
      - id
      - last_login
    Vehiculo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        placa:
          type: string
          maxLength: 12
        propietario:
          type: string
          maxLength: 100
        categoria:
          $ref: '#/components/schemas/CategoriaEnum'
        ejes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        saldo:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        activo:
          type: boolean
      required:
      - categoria
      - ejes
      - id
      - placa
      - propietario
      - saldo
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

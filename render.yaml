databases:
  - name: peaje-db
    plan: free

services:
  - type: web
    name: peaje-backend
    runtime: python
    plan: free
    rootDir: web/backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python diagnostico.py
    startCommand: python manage.py migrate --noinput && python manage.py seed_inicial && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: peaje-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: INFERENCE_URL
        sync: false
      - key: INFERENCE_TOKEN
        sync: false
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_KEY
        sync: false
      - key: PUSHER_SECRET
        sync: false
      - key: PUSHER_CLUSTER
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: OPERADOR_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: peaje-frontend
    runtime: static
    rootDir: web/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_PUSHER_KEY
        sync: false
      - key: VITE_PUSHER_CLUSTER
        sync: false
